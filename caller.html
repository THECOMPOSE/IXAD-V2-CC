<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call IXADCC</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="card" style="max-width:700px;margin:auto;text-align:center"><div class="brand">IXADCC</div><p class="muted">Customer Call Center</p><div id="msg" class="status">Ready to call</div>
<div class="card announcements"><h2>📢 IXADCC Announcements</h2><div id="announcements"><p class="muted">Loading announcements…</p></div></div><button id="call" class="green wide callbtn">📞 CALL IXADCC</button>
<div id="wait" class="card hidden"><h2>🎵 Please wait</h2><p>We're connecting you to an IXADCC operator.</p><audio id="music" src="/hold-music.mp3" loop controls></audio><button id="end" class="red wide">☎ END CALL</button></div>
<div id="connected" class="card hidden"><h2>🎤 You're connected</h2><p>Talk normally. Your microphone is active.</p><audio id="remote" autoplay></audio><button id="end2" class="red wide">☎ END CALL</button></div>
</div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};let pc=null,stream=null,operatorId=null;const $=id=>document.getElementById(id);
socket.on('announcements',renderAnnouncements);socket.emit('get-announcements');function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderAnnouncements(items){$('announcements').innerHTML=items.length?items.map(a=>`<div class="announcement"><b>${esc(a.title)}</b><span>${esc(a.message)}</span></div>`).join(''):'<p class="muted">No announcements right now.</p>'}
$('call').onclick=()=>{$('msg').textContent='Calling IXADCC…';$('call').disabled=true;$('wait').classList.remove('hidden');$('music').play().catch(()=>{});socket.emit('call-ixadcc')};socket.on('unavailable',()=>{$('msg').textContent='🔴 IXADCC is offline. Please try again later.';$('wait').classList.add('hidden');$('music').pause();$('call').disabled=false});
socket.on('answered',async({operatorId:id})=>{operatorId=id;$('wait').classList.add('hidden');$('music').pause();$('connected').classList.remove('hidden');$('msg').textContent='Connected';await start()});async function start(){pc=new RTCPeerConnection(cfg);pc.onicecandidate=e=>e.candidate&&socket.emit('signal',{to:operatorId,data:{candidate:e.candidate}});pc.ontrack=e=>$('remote').srcObject=e.streams[0];stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>pc.addTrack(t,stream));const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('signal',{to:operatorId,data:{offer:o}})}
socket.on('signal',async({from,data})=>{operatorId=from;if(data.answer&&pc)await pc.setRemoteDescription(data.answer);if(data.candidate&&pc)try{await pc.addIceCandidate(data.candidate)}catch(e){}});function end(){socket.emit('hangup');if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop());pc=null;stream=null;$('music').pause();$('music').currentTime=0;$('wait').classList.add('hidden');$('connected').classList.add('hidden');$('msg').textContent='Ready to call';$('call').disabled=false;$('call').textContent='📞 CALL IXADCC'}$('end').onclick=end;$('end2').onclick=end;socket.on('ended',end);
</script></body></html>
